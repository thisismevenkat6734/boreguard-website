<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Edit Report - BoreGuard</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fa;
}

header{
background:#0077cc;
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

input,
textarea,
button{
width:100%;
padding:12px;
margin-top:12px;
margin-bottom:15px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#28a745;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#218838;
}

img{
width:100%;
border-radius:10px;
margin-top:10px;
}

</style>

</head>

<body>

<header>
✏️ Edit Report
</header>

<div class="container">

<input
type="text"
id="location"
placeholder="Location">

<textarea
id="description"
rows="5"
placeholder="Description">
</textarea>

<input
type="file"
id="photo"
accept="image/*">

<img id="preview">

<button onclick="updateReport()">
💾 Save Changes
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDc4-YGMUo8C7b45NKZ7jNYbRKfKKC_V0I",
authDomain:"boreguard-57e1b.firebaseapp.com",
projectId:"boreguard-57e1b",
storageBucket:"boreguard-57e1b.firebasestorage.app",
messagingSenderId:"630445227350",
appId:"1:630445227350:web:3974c5f0ff4ca692946af7"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const reportId=localStorage.getItem("editReportId");

let oldImage="";
  async function loadReport(){

const snap=await getDoc(doc(db,"reports",reportId));

if(!snap.exists()){

alert("Report not found");

window.location.href="myreports.html";

return;

}

const data=snap.data();

document.getElementById("location").value=data.location||"";

document.getElementById("description").value=data.description||"";

oldImage=data.image||"";

if(oldImage){

const preview=document.getElementById("preview");

preview.src=oldImage;

preview.style.display="block";

}

}

loadReport();

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(file){

const preview=document.getElementById("preview");

preview.src=URL.createObjectURL(file);

preview.style.display="block";

}

});
  window.updateReport=async function(){

try{

let imageUrl=oldImage;

const photo=document.getElementById("photo").files[0];

if(photo){

const formData=new FormData();

formData.append("file",photo);
formData.append("upload_preset","boreguard_upload");

const response=await fetch(
"https://api.cloudinary.com/v1_1/dkshchiq7/image/upload",
{
method:"POST",
body:formData
}
);

const result=await response.json();

if(result.secure_url){

imageUrl=result.secure_url;

}else{

throw new Error("Image upload failed");

}

}

await updateDoc(doc(db,"reports",reportId),{

location:document.getElementById("location").value,

description:document.getElementById("description").value,

image:imageUrl,

updatedAt:new Date()

});

alert("✅ Report Updated Successfully");

localStorage.removeItem("editReportId");

window.location.href="myreports.html";

}catch(e){

console.error(e);

alert(e.message);

}

}

</script>

</body>
</html>
