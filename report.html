
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BoreGuard - Report Borewell</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fa;
}

header{
background:#0077cc;
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
margin-top:0;
}

input,
textarea,
button{
width:100%;
padding:12px;
margin-top:12px;
margin-bottom:15px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#28a745;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#218838;
}

#map{
height:300px;
border-radius:10px;
margin-bottom:15px;
}

#preview{
width:100%;
display:none;
border-radius:10px;
margin-top:10px;
}

</style>

</head>

<body>

<header>
🚨 BoreGuard Report
</header>

<div class="container">

<h2>Report Open Borewell</h2>

<div id="map"></div>
<input
type="text"
id="searchBox"
placeholder="Search Place..."
style="width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;">

<button onclick="searchPlace()" style="width:100%;margin-bottom:10px;">
🔍 Search
</button>
<input
type="text"
id="location"
placeholder="Fetching Location..."
readonly>

<input
type="file"
id="photo"
accept="image/*"
capture="environment">

<img id="preview">

<textarea
id="description"
rows="5"
placeholder="Describe the Borewell">
</textarea>

<button onclick="submitReport()">
Submit Report
</button>

</div>
<script>

if(
!localStorage.getItem("name") ||
!localStorage.getItem("district") ||
!localStorage.getItem("village")
){
window.location.href="register.html";
}

</script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const preview=document.getElementById("preview");

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(file){

preview.src=URL.createObjectURL(file);

preview.style.display="block";

}

});

var map=L.map("map").setView([20.5937,78.9629],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19
}
).addTo(map);

var marker;

navigator.geolocation.getCurrentPosition(

function(position){

const lat=position.coords.latitude;
const lng=position.coords.longitude;

map.setView([lat,lng],17);

document.getElementById("location").value=
lat.toFixed(6)+", "+lng.toFixed(6);

marker=L.marker(
[lat,lng],
{
draggable:true
}
).addTo(map);

marker.on("dragend",function(){

const pos=marker.getLatLng();

document.getElementById("location").value=
pos.lat.toFixed(6)+", "+
pos.lng.toFixed(6);

});

},

function(error){

alert(error.message);

},

{
async function searchPlace() {

const place = document.getElementById("searchBox").value;

if(!place) return;

const response = await fetch(
"https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(place)
);

const data = await response.json();

if(data.length===0){
alert("Place not found");
return;
}

const lat=parseFloat(data[0].lat);
const lon=parseFloat(data[0].lon);

map.setView([lat,lon],17);

marker.setLatLng([lat,lon]);

document.getElementById("location").value=
lat.toFixed(6)+", "+lon.toFixed(6);

}
enableHighAccuracy:true,
timeout:60000,
maximumAge:0

}

);

</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDc4-YGMUo8C7b45NKZ7jNYbRKfKKC_V0I",
  authDomain: "boreguard-57e1b.firebaseapp.com",
  projectId: "boreguard-57e1b",
  storageBucket: "boreguard-57e1b.firebasestorage.app",
  messagingSenderId: "630445227350",
  appId: "1:630445227350:web:3974c5f0ff4ca692946af7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitReport = async function () {

try {

const location = document.getElementById("location").value;
const description = document.getElementById("description").value;
const photo = document.getElementById("photo").files[0];

let imageUrl = "";

if(photo){

const data = new FormData();

data.append("file",photo);
data.append("upload_preset","boreguard_upload");
document.getElementById("preview").src="";
const response = await fetch(
"https://api.cloudinary.com/v1_1/dkshchiq7/image/upload",
{
method:"POST",
body:data
}
);

const result = await response.json();

if(result.secure_url){

imageUrl=result.secure_url;

}else{

throw new Error("Image upload failed");

}

}

await addDoc(collection(db,"reports"),{

name:localStorage.getItem("name"),
district:localStorage.getItem("district"),
village:localStorage.getItem("village"),

location:location,
description:description,
image:imageUrl,

timestamp:new Date()

});

alert("✅ Report Submitted Successfully!");

document.getElementById("description").value="";
document.getElementById("photo").value="";
document.getElementById("preview").style.display="none";

}
catch(e){

console.error(e);

alert(
"Error:\n"+
e.message
);

}

};

async function loadReports() {

  const snapshot = await getDocs(collection(db, "reports"));

  snapshot.forEach((doc) => {

    const data = doc.data();

    if (!data.location) return;

    const coords = data.location.split(",");

    if (coords.length !== 2) return;

    const lat = parseFloat(coords[0]);
    const lng = parseFloat(coords[1]);

    if (isNaN(lat) || isNaN(lng)) return;

let popup = `
<b>${data.name}</b><br>
📍 ${data.village}, ${data.district}<br><br>

📝 ${data.description}<br><br>

${data.image ? `<img src="${data.image}" width="150"><br><br>` : ""}

<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">
<button style="padding:8px 15px;background:#0077cc;color:white;border:none;border-radius:6px;">
🧭 Navigate
</button>
</a>
`;
    

    if (data.image) {
      popup += `<br><img src="${data.image}" width="150">`;
    }

    L.marker([lat, lng]).addTo(map).bindPopup(popup);

  });

}

loadReports();

</script>

</script>

</body>
</html>
