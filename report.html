<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Borewell - BoreGuard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f7fa;
}

header{
background:#0077cc;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#218838;
}

#map{
height:300px;
border-radius:10px;
margin-bottom:15px;
}
</style>

</head>

<body>

<header>
🚨 Report Open Borewell
</header>

<div class="container">

<h2>Borewell Report</h2>

<div id="map"></div>

<input type="text" id="location" placeholder="Fetching Location..." readonly>

<input
  type="file"
  id="photo"
  accept="image/*"
  capture="environment">
  <img id="preview" style="width:100%;margin-top:15px;border-radius:10px;display:none;">

<textarea id="description" rows="5"
placeholder="Describe the Borewell..."></textarea>

<button onclick="submitReport()">
Submit Report
</button>

</div>
<script>
if (
  !localStorage.getItem("name") ||
  !localStorage.getItem("district") ||
  !localStorage.getItem("village")
) {
  window.location.href = "register.html";
}
</script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map=L.map('map').setView([20.5937,78.9629],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var marker;

navigator.geolocation.getCurrentPosition(function(position){

var lat=position.coords.latitude;
var lng=position.coords.longitude;

map.setView([lat,lng],17);
document.getElementById("location").value =
    lat.toFixed(6) + ", " + lng.toFixed(6);
marker = L.marker([lat, lng], {
    draggable: true
}).addTo(map);
  marker.on("dragend", function () {

    var pos = marker.getLatLng();

    document.getElementById("location").value =
        pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6);

});
},
function(error){
    alert("Error Code: " + error.code + "\n" + error.message);
},
{
    enableHighAccuracy: false,
    timeout: 60000,
    maximumAge: 0
}
);


</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDc4-YGMUo8C7b45NKZ7jNYbRKfKKC_V0I",
  authDomain: "boreguard-57e1b.firebaseapp.com",
  projectId: "boreguard-57e1b",
  storageBucket: "boreguard-57e1b.firebasestorage.app",
  messagingSenderId: "630445227350",
  appId: "1:630445227350:web:3974c5f0ff4ca692946af7",
  measurementId: "G-9F488TCQK7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


window.submitReport = async function () {
  alert("submitReport started");

const photo = document.getElementById("photo").files[0];
let imageUrl = "";

if(photo){

const data = new FormData();

data.append("file", photo);
data.append("upload_preset", "boreguard_upload");
alert("Uploading image...");
const response = await fetch("https://api.cloudinary.com/v1_1/dkshchiq7/image/upload",{
method:"POST",
body:data
});

const result = await response.json();console.log(result);


if(result.secure_url){
    imageUrl = result.secure_url;
}else{
    alert(JSON.stringify(result));
    return;
}
}
  const location = document.getElementById("location").value;
  const description = document.getElementById("description").value;

  try {
    await addDoc(collection(db, "reports"), {

  name: localStorage.getItem("name"),

  district: localStorage.getItem("district"),

  village: localStorage.getItem("village"),

  location: location,

  description: description,

  image: imageUrl,

  timestamp: new Date()

});

    alert("✅ Report Submitted Successfully!");

  } catch (e) {
    alert("❌ Error: " + e.message);
  }

};

</script>
</body>
</html>
