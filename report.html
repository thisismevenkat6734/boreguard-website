<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Borewell - BoreGuard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f7fa;
}

header{
background:#0077cc;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#218838;
}

#map{
height:300px;
border-radius:10px;
margin-bottom:15px;
}
</style>

</head>

<body>

<header>
🚨 Report Open Borewell
</header>

<div class="container">

<h2>Borewell Report</h2>

<div id="map"></div>

<input type="text" id="location" placeholder="Fetching Location..." readonly>

<input
  type="file"
  id="photo"
  accept="image/*"
  capture="environment">
  <img id="preview" style="width:100%;margin-top:15px;border-radius:10px;display:none;">

<textarea id="description" rows="5"
placeholder="Describe the Borewell..."></textarea>

<button onclick="submitReport()">
Submit Report
</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map=L.map('map').setView([20.5937,78.9629],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

var marker;

navigator.geolocation.getCurrentPosition(function(position){

var lat=position.coords.latitude;
var lng=position.coords.longitude;

map.setView([lat,lng],17);

marker = L.marker([lat, lng], {
    draggable: true
}).addTo(map);
  marker.on("dragend", function () {

    var pos = marker.getLatLng();

    document.getElementById("location").value =
        pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6);

});

document.getElementById("location").value=
lat+", "+lng;

});

function submitReport(){

alert("Next Step: Firebase Database Integration");

}

</script>

</body>
</html>
